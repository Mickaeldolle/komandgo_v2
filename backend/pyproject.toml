[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=apps --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "RUF", "SIM", "C4"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
