openapi: 3.0.3
info:
  title: KomandGo API
  version: 1.0.0
  description: API publique et authentifiée de KomandGo.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: cart_item_add
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_clear
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cart/items/{item_id}/:
    patch:
      operationId: cart_item_update
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_item_remove
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/orders/:
    get:
      operationId: orders_list
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
    post:
      operationId: orders_checkout
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Clé unique du client pour rendre le checkout idempotent.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{public_id}/:
    get:
      operationId: orders_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/restaurants/:
    get:
      operationId: restaurants_list
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: delivery_enabled
        schema:
          type: boolean
      - in: query
        name: is_open
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pickup_enabled
        schema:
          type: boolean
      - in: query
        name: postcode
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - restaurants
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRestaurantListList'
          description: ''
  /api/v1/restaurants/{slug}/:
    get:
      operationId: restaurants_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - restaurants
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantDetail'
          description: ''
  /api/v1/restaurants/{slug}/products/{product_slug}/:
    get:
      operationId: restaurants_products_retrieve
      parameters:
      - in: path
        name: product_slug
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - restaurants
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 99
          minimum: 1
          default: 1
        option_ids:
          type: array
          items:
            type: integer
            minimum: 1
        note:
          type: string
          default: ''
          maxLength: 300
      required:
      - product_id
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        restaurant:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/CartStatusEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - items
      - restaurant
      - subtotal
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_slug:
          type: string
          readOnly: true
        product_name:
          type: string
          maxLength: 100
        image_url:
          type: string
          format: uri
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        note:
          type: string
          maxLength: 300
        selections:
          type: array
          items:
            $ref: '#/components/schemas/CartItemOption'
          readOnly: true
      required:
      - id
      - image_url
      - is_available
      - line_total
      - product
      - product_name
      - product_slug
      - selections
      - unit_price
    CartItemOption:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group_name:
          type: string
          maxLength: 80
        option_name:
          type: string
          maxLength: 80
        price_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - group_name
      - id
      - option_name
      - price_delta
    CartStatusEnum:
      enum:
      - active
      - converted
      - abandoned
      type: string
      description: |-
        * `active` - Actif
        * `converted` - Converti
        * `abandoned` - Abandonné
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 90
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 240
        image_url:
          type: string
          format: uri
          maxLength: 500
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          readOnly: true
      required:
      - id
      - name
      - products
      - slug
    CheckoutRequest:
      type: object
      properties:
        fulfillment:
          $ref: '#/components/schemas/FulfillmentEnum'
        delivery_address:
          type: string
          default: ''
          maxLength: 300
        comment:
          type: string
          default: ''
          maxLength: 500
        accepted_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - accepted_total
      - fulfillment
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    FulfillmentEnum:
      enum:
      - pickup
      - delivery
      - onsite
      type: string
      description: |-
        * `pickup` - À emporter
        * `delivery` - Livraison
        * `onsite` - Sur place
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    OptionGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 240
        minimum:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        maximum:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
          readOnly: true
      required:
      - id
      - name
      - options
    Order:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: string
          readOnly: true
        restaurant_slug:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        fulfillment:
          $ref: '#/components/schemas/FulfillmentEnum'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        delivery_address:
          type: string
          maxLength: 300
        comment:
          type: string
          maxLength: 500
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - fulfillment
      - items
      - public_id
      - restaurant
      - restaurant_slug
      - subtotal
      - total
      - updated_at
    OrderItem:
      type: object
      properties:
        product_name:
          type: string
          maxLength: 100
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        note:
          type: string
          maxLength: 300
        selections:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemOption'
          readOnly: true
      required:
      - line_total
      - product_name
      - quantity
      - selections
      - unit_price
    OrderItemOption:
      type: object
      properties:
        group_name:
          type: string
          maxLength: 80
        option_name:
          type: string
          maxLength: 80
        price_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - group_name
      - option_name
      - price_delta
    OrderStatusEnum:
      enum:
      - pending
      - confirmed
      - in_preparation
      - ready
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - En attente
        * `confirmed` - Confirmée
        * `in_preparation` - En préparation
        * `ready` - Prête
        * `completed` - Terminée
        * `cancelled` - Annulée
    PaginatedRestaurantListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantList'
    PatchedUpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          maximum: 99
          minimum: 1
    PatchedUserRequest:
      type: object
      properties:
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        phone:
          type: string
          title: Téléphone
          maxLength: 20
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 110
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 800
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image_url:
          type: string
          format: uri
          maxLength: 500
        allergens:
          type: string
          maxLength: 300
        is_available:
          type: boolean
        delivery_enabled:
          type: boolean
        pickup_enabled:
          type: boolean
        onsite_enabled:
          type: boolean
        category_slug:
          type: string
          readOnly: true
        restaurant_slug:
          type: string
          readOnly: true
        option_groups:
          type: array
          items:
            $ref: '#/components/schemas/OptionGroup'
          readOnly: true
      required:
      - category_slug
      - id
      - name
      - option_groups
      - price
      - restaurant_slug
      - slug
    ProductOption:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        price_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_available:
          type: boolean
      required:
      - id
      - name
    RegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Adresse e-mail
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 10
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        phone:
          type: string
          title: Téléphone
          maxLength: 20
      required:
      - email
      - password
    RestaurantDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 600
        cuisine:
          type: string
          maxLength: 60
        city:
          type: string
          maxLength: 80
        postcode:
          type: string
          maxLength: 10
        image_url:
          type: string
          format: uri
          maxLength: 500
        is_open:
          type: boolean
        delivery_enabled:
          type: boolean
        pickup_enabled:
          type: boolean
        onsite_enabled:
          type: boolean
        minimum_order:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        address:
          type: string
          maxLength: 180
        phone:
          type: string
          maxLength: 20
        banner_url:
          type: string
          format: uri
          maxLength: 500
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          readOnly: true
      required:
      - address
      - categories
      - city
      - description
      - id
      - name
      - postcode
      - slug
    RestaurantList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 600
        cuisine:
          type: string
          maxLength: 60
        city:
          type: string
          maxLength: 80
        postcode:
          type: string
          maxLength: 10
        image_url:
          type: string
          format: uri
          maxLength: 500
        is_open:
          type: boolean
        delivery_enabled:
          type: boolean
        pickup_enabled:
          type: boolean
        onsite_enabled:
          type: boolean
        minimum_order:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - city
      - description
      - id
      - name
      - postcode
      - slug
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse e-mail
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        phone:
          type: string
          title: Téléphone
          maxLength: 20
      required:
      - email
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
