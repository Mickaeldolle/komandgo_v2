name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: komandgo_test
          POSTGRES_USER: komandgo
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komandgo -d komandgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://komandgo:test-only-password@localhost:5432/komandgo_test
      DJANGO_SECRET_KEY: ci-only-secret-long-enough-for-tests-123456789
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check --deploy
        env:
          DJANGO_SECURE_SSL_REDIRECT: "true"
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - run: uv run pytest --cov=apps --cov-fail-under=75
      - run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: komandgo_e2e
          POSTGRES_USER: komandgo
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komandgo -d komandgo_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://komandgo:test-only-password@localhost:5432/komandgo_e2e
      DJANGO_SECRET_KEY: ci-only-secret-long-enough-for-tests-123456789
      DJANGO_DEBUG: "true"
      DEMO_ADMIN_PASSWORD: ChangeMe-OnlyFor-CI-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-dev
        working-directory: backend
      - run: uv run --no-dev python manage.py migrate --noinput
        working-directory: backend
      - run: uv run --no-dev python manage.py seed_demo
        working-directory: backend
      - run: nohup uv run --no-dev python manage.py runserver 127.0.0.1:8000 > ../backend-e2e.log 2>&1 &
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
